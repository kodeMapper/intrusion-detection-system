[pytest]
pythonpath = . service
testpaths = tests
asyncio_mode = auto
markers =
    unit: fast, no external artifacts or network
    api: FastAPI route tests using dependency_overrides, no real models
    integration: exercises the real router + real model artifacts end to end
    requires_artifacts: skips cleanly when gitignored model artifacts (e.g. final_rf.pkl) are absent
    slow: longer-running perf/regression checks, not part of the default fast loop
filterwarnings =
    ignore::sklearn.exceptions.InconsistentVersionWarning
    ignore::DeprecationWarning:starlette.testclient
    ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning
